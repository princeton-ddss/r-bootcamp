project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
  resources:
    - "files/"

website:
  title: "R Bootcamp"
  favicon: assets/princeton-favicon.svg
  page-navigation: true
  navbar:
    title: "R Bootcamp"
    left:
      - href: day-1.qmd
        text: Day 1
      - href: day-2.qmd
        text: Day 2
      - href: day-3.qmd
        text: Day 3
    right:
      - href: prerequisites.qmd
        text: Prerequisites
      - href: data.qmd
        text: Data
      - href: about.qmd
        text: About
  page-footer:
    left: '<img class="footer-logo" src="https://princeton-ddss.github.io/r-bootcamp/assets/DDSS-stacked_PU_shield_black.webp" alt="Data-Driven Social Science at Princeton University">'
    right: "R Bootcamp"

# Frozen execution: R chunks run locally, CI reuses the stored output.
# Re-render locally after editing any .qmd with R code, and commit _freeze/.
execute:
  freeze: auto

# Vendored fonts so Typst renders identically everywhere (CI has no system fonts).
font-paths:
  - assets/fonts

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    smooth-scroll: true
    link-external-newwindow: true
