title: ctk-lecture
author: Christopher T. Kenny
version: 1.0.0
quarto-required: ">=1.10.0"
contributes:
  formats:
    typst:
      template-partials:
        - typst-template.typ
        - typst-show.typ
      filters:
        - quarto
        - typst-function
      mainfont:
        - "Spectral"
      codefont:
        - "Fira Code"
      date-format: long
      linestretch: 1.25
      linkcolor: "#800000"
      bibliographystyle: chicago-author-date
      execute:
        echo: false
        warning: false
      syntax-highlighting: idiomatic
      functions:
        - solution
